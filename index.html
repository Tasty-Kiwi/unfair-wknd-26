<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#E9ECE8" />
    <meta
      name="description"
      content="DominoOS — see what breaks before it breaks. An interactive, fictional manufacturing material-availability simulator."
    />
    <script>
      const landingPaint = document.createElement("style");
      landingPaint.textContent =
        'html[data-landing-theme="dark"] body { background: #0D1422; color: #F1EEE6; } html[data-landing-theme="light"] body { background: #F2F1EC; color: #182227; }';
      document.head.appendChild(landingPaint);
      if (location.pathname.replace(/\/$/, "") === "/landing") {
        let theme = "light";
        try {
          if (localStorage.getItem("dominoos.landing.theme.v2") === "dark")
            theme = "dark";
        } catch {}
        document.documentElement.dataset.landingTheme = theme;
        document.documentElement.style.backgroundColor =
          theme === "dark" ? "#0D1422" : "#F2F1EC";
        document.querySelector('meta[name="theme-color"]').content =
          theme === "dark" ? "#0D1422" : "#F2F1EC";
      }
    </script>
    <title>DominoOS — material availability what-if</title>
    <script>
      // Set the theme before first paint so dark mode never flashes light.
      (function () {
        // /landing applies the same preference itself.
        if (location.pathname.replace(/\/$/, "") === "/landing") return;
        try {
          var t = localStorage.getItem("dominoos.landing.theme.v2");
          if (t !== "light" && t !== "dark")
            t = matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
          if (t === "dark") document.documentElement.classList.add("dark");
          document.documentElement.style.colorScheme = t;
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
